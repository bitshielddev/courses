<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#17211d">
    <title>Page not found · C / Field Manual</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='8' fill='%2317211d'/%3E%3Cpath d='m9 13 7 7-7 7m12 0h10' fill='none' stroke='%23bff2cb' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
    <style>
      :root {
        --paper: #f8f8f2;
        --ink: #202b25;
        --muted: #536158;
        --forest: #204f3e;
        --forest-deep: #163b2e;
        --mint: #bcf1cd;
        --terminal: #19241f;
        --terminal-text: #e4efe8;
        --terminal-muted: #a1b4a8;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px 16px;
        background: var(--paper);
        color: var(--ink);
        font: 400 1rem/1.6 system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }
      main { width: min(100%, 34rem); }
      .eyebrow {
        margin: 0 0 8px;
        color: var(--muted);
        font: 600 0.78rem/1.4 'SFMono-Regular', Consolas, 'Liberation Mono', monospace;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      h1 {
        margin: 0 0 12px;
        font: 400 clamp(2rem, 6vw, 2.6rem)/1.15 Georgia, 'Times New Roman', serif;
      }
      pre {
        margin: 24px 0;
        padding: 16px 18px;
        overflow-x: auto;
        border-radius: 10px;
        background: var(--terminal);
        color: var(--terminal-text);
        font: 0.9rem/1.6 'SFMono-Regular', Consolas, 'Liberation Mono', monospace;
      }
      pre span { color: var(--terminal-muted); }
      a {
        display: inline-block;
        padding: 10px 16px;
        border-radius: 8px;
        background: var(--forest);
        color: #fff;
        font-weight: 600;
        text-decoration: none;
      }
      a:hover { background: var(--forest-deep); }
      a:focus-visible { outline: 3px solid var(--mint); outline-offset: 2px; }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">404 · Page not found</p>
      <h1>That address points at nothing.</h1>
      <p>The course lives on a single page, so there is nothing at this path.</p>
      <pre><span>char *page = </span>lookup(path);
<span>/* page == NULL */</span></pre>
      <a href="/">Go to the course</a>
    </main>
  </body>
</html>
